services:
  web:
    build: .
    ports:
      - "8001:8000"
    env_file:
      - .env_docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: ["sh", "docker-entrypoint.sh"]

  db:
    image: postgres:16-alpine
    env_file:
      - .env_docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_user -d stock_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    hostname: db
    volumes:
      - stock_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  celery:
    build: .
    command: celery -A stock_service worker --loglevel=info
    env_file:
      - .env_docker
    depends_on:
      # Wait for web, not just db - web only reports healthy once its
      # entrypoint has finished running `migrate`. Otherwise celery-beat
      # can fire a task before the tables exist on a fresh database.
      web:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  celery-beat:
    build: .
    command: celery -A stock_service beat --loglevel=info
    env_file:
      - .env_docker
    depends_on:
      web:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  stock_postgres_data:
