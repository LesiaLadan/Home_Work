{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}BookStore{% endblock %}</title>

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  
  <link rel="stylesheet" href="{% static 'shop/css/style.css' %}">
</head>

<body>

<nav class="navbar custom-navbar px-3">

    <a class="navbar-brand text-white"
       href="{% url 'shop:main_page' %}">
        BookStore
    </a>

    <div class="d-flex align-items-center gap-3">

        <a class="nav-link text-white"
           href="{% url 'shop:books_list' %}">
            Books
        </a>

        <a class="nav-link text-white"
           href="{% url 'shop:authors_list' %}">
            Authors
        </a>

        <a class="nav-link text-white"
           href="{% url 'shop:categories_list' %}">
            Categories
        </a>

        {% if user.is_authenticated %}

            <a class="nav-link text-white"
               href="{% url 'order:order_list' %}">
                My Orders
            </a>

            <span class="nav-link text-white">
                Welcome, {{ user.username }}!
            </span>

            <form method="post" action="{% url 'user_management:logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="nav-link text-white btn btn-link p-0">
                    Logout
                </button>
            </form>

        {% else %}

            <a class="nav-link text-white"
               href="{% url 'user_management:register' %}">
                Registration
            </a>

            <a class="nav-link text-white"
               href="{% url 'user_management:login' %}">
                Login
            </a>

        {% endif %}

    </div>

</nav>

<div class="container mt-4">
  {% block content %}{% endblock %}
</div>

</body>
</html>
