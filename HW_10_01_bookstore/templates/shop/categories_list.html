{% extends "base.html" %}

{% block title %}Categories | BookStore{% endblock %}

{% block content %}

<h2>Categories</h2>

<form method="GET" class="mb-3 d-flex gap-2">
    <input
        type="text"
        name="q"
        class="form-control"
        placeholder="Search categories..."
        value="{{ request.GET.q }}"
    >
    <button type="submit" class="btn btn-dark">
        Search
    </button>

    {% if request.GET.q %}
        <a href="?" class="btn btn-outline-danger">
            ✕
        </a>
    {% endif %}
</form>

<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-2">

    {% for category in categories %}
        <div class="col">
            <div class="border rounded p-2 h-100">
                <a class="text-decoration-none title"
                   href="{% url 'shop:category_detail' category.pk %}">
                    {{ category.name }}
                </a>
            </div>
        </div>
    {% empty %}
        <div class="col">
            <div class="text-muted">
                No categories found.
            </div>
        </div>
    {% endfor %}

</div>

{% endblock %}
