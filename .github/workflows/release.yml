name: HW_25 Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  docker:
    name: Build and push release image
    runs-on: ubuntu-latest
    # Requires a "release" environment configured in the repo
    # (Settings -> Environments -> New environment -> Required
    # reviewers) - the job pauses here until someone approves it.
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract release tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: HW_25
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hw25-bookstore:${{ steps.tag.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hw25-bookstore:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
