name: HW_25 Book Store CI/CD

on:
  push:
    branches: [main]
    paths:
      - "HW_25/**"
      - ".github/workflows/django.yml"
  pull_request:
    branches: [main]
    paths:
      - "HW_25/**"
      - ".github/workflows/django.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: HW_25

env:
  PYTHON_VERSION: "3.12"

jobs:
  format:
    name: Black (formatter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: HW_25/requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Check formatting with black
        run: black --check --diff .

  lint:
    name: Flake8 (linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: HW_25/requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: flake8 .

  test:
    name: Pytest (tests + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: HW_25/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        env:
          DJANGO_SETTINGS_MODULE: book_store.test_settings
          SECRET_KEY: ci-test-secret-key
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: HW_25/coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: HW_25/coverage.xml
          flags: hw25
          fail_ci_if_error: false

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: [format, lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: HW_25
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hw25-bookstore:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hw25-bookstore:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
